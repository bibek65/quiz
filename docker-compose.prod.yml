services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL}
        - NEXT_PUBLIC_SOCKET_PATH=${NEXT_PUBLIC_SOCKET_PATH}
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - HOST_PASSWORD=${HOST_PASSWORD}
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL}
      - NEXT_PUBLIC_SOCKET_PATH=${NEXT_PUBLIC_SOCKET_PATH:-/socket.io}
      - SOCKET_EMIT_URL=${SOCKET_EMIT_URL:-http://socket:4000/emit}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
      - NODE_ENV=production
    depends_on:
      - postgres
      - socket
    restart: unless-stopped
    networks:
      - quiz-network

  socket:
    build:
      context: .
      dockerfile: Dockerfile.socket
    environment:
      - PORT=4000
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
    restart: unless-stopped
    networks:
      - quiz-network

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quizuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizpass}
      POSTGRES_DB: ${POSTGRES_DB:-quizdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - quiz-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
      - socket
    restart: unless-stopped
    networks:
      - quiz-network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
    command: ["npx", "prisma", "db", "push", "--accept-data-loss"]
    depends_on:
      - postgres
    networks:
      - quiz-network
    profiles:
      - migrate

volumes:
  postgres_data:

networks:
  quiz-network:
    driver: bridge
