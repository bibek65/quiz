services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-http://192.168.16.132:8080}
        - NEXT_PUBLIC_SOCKET_PATH=${NEXT_PUBLIC_SOCKET_PATH:-/socket.io}
    environment:
      - DATABASE_URL=postgresql://quizuser:quizpass@postgres:5432/quizdb?schema=public
      - SESSION_SECRET=${SESSION_SECRET:-local-dev-secret}
      - HOST_PASSWORD=${HOST_PASSWORD:-admin123}
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-http://192.168.16.132:8080}
      - NEXT_PUBLIC_SOCKET_PATH=${NEXT_PUBLIC_SOCKET_PATH:-/socket.io}
      - SOCKET_EMIT_URL=http://socket:4000/emit
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-*}
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    depends_on:
      - postgres
      - socket
    restart: unless-stopped
    networks:
      - quiz-network
    ports:
      - "3000:3000"

  socket:
    build:
      context: .
      dockerfile: Dockerfile.socket
    environment:
      - PORT=4000
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-*}
    volumes:
      - .:/app
      - /app/node_modules
    command: node socket-server.js
    restart: unless-stopped
    networks:
      - quiz-network

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: quizuser
      POSTGRES_PASSWORD: quizpass
      POSTGRES_DB: quizdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - quiz-network

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - socket
    restart: unless-stopped
    networks:
      - quiz-network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://quizuser:quizpass@postgres:5432/quizdb?schema=public
    command: ["npx", "prisma", "db", "push", "--accept-data-loss"]
    depends_on:
      - postgres
    networks:
      - quiz-network
    profiles:
      - migrate

volumes:
  postgres_data:

networks:
  quiz-network:
    driver: bridge